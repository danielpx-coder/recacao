[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "danaurium-redacao-studio"
version = "1.0.0"
description = "Danaurium Redação Studio: Aplicativo desktop de jornalismo e comunicação institucional."
readme = "README.md"
authors = [{ name = "Danaurium Software" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "keyring>=24.0.0",
    "python-docx>=1.0.0",
    "pypdf>=4.0.0",
]

[project.scripts]
danaurium = "danaurium.app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
